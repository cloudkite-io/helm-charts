kube-prometheus-stack:
  grafana:
    enabled: false
  # Node health alerting comes from upstream instead of being hand-written. The groups
  # enabled below cover disk filling up, inode and file-descriptor exhaustion, clock
  # skew, conntrack saturation, CPU/memory/IO saturation, NIC errors and flapping, and
  # NotReady/Unreachable nodes.
  #
  # Everything else is off on purpose:
  #   - the control-plane groups (kubeControllerManager, kubeProxy, kubeScheduler*) fire
  #     permanently on managed clusters, where those components are not scrapeable
  #   - the workload groups (kubernetesApps, kubernetesStorage) would duplicate the
  #     alerts the `prometheus-rules` chart already ships
  # Alerts only reach a receiver on clusters that enable Alertmanager; where it stays
  # disabled they are visible in Prometheus and Grafana only.
  defaultRules:
    create: true
    rules:
      node: true                   # node.rules recording rules
      nodeExporterAlerting: true   # the Node* alert set
      nodeExporterRecording: true  # instance:node_* recording rules
      network: true                # NodeNetworkInterfaceFlapping
      kubernetesSystem: true       # KubeNodeNotReady, KubeNodeUnreachable, KubeletDown
      alertmanager: false
      configReloaders: false
      etcd: false
      general: false
      k8sContainerCpuUsageSecondsTotal: false
      k8sContainerMemoryCache: false
      k8sContainerMemoryRss: false
      k8sContainerMemorySwap: false
      k8sContainerMemoryWorkingSetBytes: false
      k8sContainerResource: false
      k8sPodOwner: false
      kubeApiserverAvailability: false
      kubeApiserverBurnrate: false
      kubeApiserverHistogram: false
      kubeApiserverSlos: false
      kubeControllerManager: false
      kubelet: false
      kubeProxy: false
      kubePrometheusGeneral: false
      kubePrometheusNodeRecording: false
      kubernetesApps: false
      kubernetesResources: false
      kubernetesStorage: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      kubeStateMetrics: false
      prometheus: false
      prometheusOperator: false
      windows: false

  # The kubelet's /metrics/resource endpoint is the only node-level source on clusters
  # that cannot run node-exporter (GKE Autopilot, EKS Fargate). Scraping it stays off by
  # default: it is an extra scrape on every node, and clusters with node-exporter gain
  # nothing from it. The path is corrected here regardless, because the chart still
  # defaults to the pre-1.18 /metrics/resource/v1alpha1 name, which is a permanently
  # failing target on every supported Kubernetes version. README.md has the opt-in.
  kubelet:
    serviceMonitor:
      resourcePath: /metrics/resource

  # node-exporter ships its ServiceMonitor with no relabelings, so every node_* series
  # is identified only by `instance`, an IP:port. Copy the node name onto the series so
  # dashboards and alerts can name the node instead of repeating IPs at the reader.
  prometheus-node-exporter:
    prometheus:
      monitor:
        relabelings:
          - action: replace
            sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: node
  alertmanager:
    enabled: false
    config:
      route:
        group_by: ['alertname', 'cluster', 'service', 'job']
    templateFiles:
      default_template.tmpl: |-
        {{ define "cluster" }}{{ .ExternalURL | reReplaceAll ".*alertmanager\\.(.*)" "$1" }}{{ end }}

        {{ define "msteams.ck.text" }}
        {{- $root := . -}}
        {{ range .Alerts -}}
        *Severity:* `{{ .Labels.severity }}`

        *Description:* {{ .Annotations.description }}

        {{ with .Annotations.query }}
        *Query:* {{ . }}
        {{- end }}
        {{ end }}
        {{ end }}

        {{ define "msteams.ck.title" }}
        [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
        {{ end }}

  prometheus:
    prometheusSpec:
      # Only ServiceMonitors labelled `release: <this release>` are scraped. This is
      # the kube-prometheus-stack default, set explicitly because ServiceMonitors from
      # other releases (Traefik, Velero) must carry that label to be picked up - see
      # README.md. Set to false, together with `serviceMonitorSelector: {}`, to scrape
      # every ServiceMonitor in the cluster regardless of label.
      serviceMonitorSelectorNilUsesHelmValues: true
      # How long the startup probe waits for WAL replay, which returns 503 until it
      # completes. The operator's fallback is 900s; a Prometheus whose replay takes
      # longer gets killed mid-replay, leaving the WAL un-checkpointed so the next
      # replay is just as long, and it never starts again. Raise this per cluster if a
      # replay legitimately needs longer than 30 minutes.
      maximumStartupDurationSeconds: 1800
      # Enough for a small cluster only. Anything scraping node-exporter and cAdvisor
      # across more than a handful of nodes needs more, set per cluster.
      resources:
        requests:
          memory: 1Gi
        limits:
          memory: 1Gi
      remoteWrite:
        - url: https://mimir-CLIENT_NAME.prod.cloudkite.io/api/v1/push
          basicAuth:
            username:
              name: basic-auth-creds
              key: username
            password:
              name: basic-auth-creds
              key: password
          headers:
            X-Scope-OrgID: CLIENT_NAME
          writeRelabelConfigs:
            # Metrics shipped to central Mimir. This list is what the dashboards in
            # dashboards/ query, so anything removed here goes blank in the central
            # per-tenant Grafana (it stays visible in this cluster's own Prometheus).
            #
            # Grouped by which baseline item needs it. Each group is scoped to the
            # specific metrics the panels use rather than a wildcard, because
            # remote-write volume is billed:
            #   kube_namespace_labels          namespace template variable
            #   kube_deployment_*              deployment health
            #   container_oom_events_total     container OOM events
            #   container_{cpu,memory,network}_*  per-container resource usage
            #   kubelet_volume_stats_*         volume utilisation %
            #   node_{cpu,memory,disk,filesystem}_*  node health, volume saturation
            #   node_load*, node_pressure_*    node saturation (load per core, PSI stall)
            #   node_boot_time_seconds         unexpected reboots, spot evictions
            #   node_vmstat_pgmajfault         memory pressure before OOM
            #   node_timex_*                   clock skew, which breaks TLS and auth
            #   node_nf_conntrack_entries*     conntrack exhaustion on ingress nodes
            #   node_filefd_*                  file descriptor exhaustion
            #   kubelet_running_pods           pod density against the per-node cap
            #   up                             any scrape target down, one series per target
            #   node_cpu_usage_seconds_total, node_memory_working_set_bytes
            #                                  kubelet /metrics/resource, the CPU and
            #                                  memory fallback where node-exporter
            #                                  cannot run
            #   traefik_*                      HTTP 5xx / 4xx / RPS
            #   x509_*                         certificate expiry
            #   velero_backup*                 backup success/failure
            - sourceLabels:
              - "__name__"
              regex: "kubernetes_build_info|version_checker_is_latest_version\
                |kube_pod_.*|kube_node_.*|kube_namespace_labels|kube_deployment_spec_replicas|kube_deployment_status_.*\
                |container_oom_events_total|container_cpu_usage_seconds_total|container_memory_working_set_bytes\
                |container_network_(receive|transmit)_bytes_total\
                |kubelet_volume_stats_.*\
                |node_cpu_seconds_total|node_memory_Mem(Available|Total)_bytes|node_disk_.*|node_filesystem_.*\
                |node_load(1|5|15)|node_boot_time_seconds|node_vmstat_pgmajfault|node_pressure_.*\
                |node_timex_(sync_status|offset_seconds)|node_nf_conntrack_entries(_limit)?\
                |node_filefd_(allocated|maximum)|kubelet_running_pods|up\
                |node_cpu_usage_seconds_total|node_memory_working_set_bytes\
                |traefik_service_.*|traefik_entrypoint_.*|traefik_config_.*\
                |x509_.*|velero_backup.*"
              action: "keep"
          queueConfig:
            capacity: 5000
            maxSamplesPerSend: 1000
            maxShards: 100
      externalLabels:
        cluster: CLUSTER_NAME
  prometheusOperator:
    verticalPodAutoscaler:
      enabled: true

# basic_auth:
#   username: USERNAME
#   password: PASSWORD

version-checker:
  replicaCount: 1
  additionalAnnotations: {}
  additionalLabels: {}
  acr:
    username:
    password:
    refreshToken:
  docker:
    username:
    password:
    token:
  ecr:
    accessKeyID:
    secretAccessKey:
    sessionToken:
    iamRoleArn:
  quay:
    token:
  gcr:
    token:
  env: []
  selfhosted: []
  resources: {}
  versionChecker:
    logLevel: info
    metricsServingAddress: 0.0.0.0:8080
    testAllContainers: true
    imageCacheTimeout: 30m
  service:
    annotations: {}
    labels: {}
    port: 8080
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: "monitoring"

x509-certificate-exporter:
  prometheusServiceMonitor:
    create: true
    extraLabels:
      release: "monitoring"
  prometheusRules:
    create: false
      
vpaApps:
  enabled: true
  configs:
    prometheus:
      kind: StatefulSet
    kube-state-metrics:
      kind: Deployment
    prometheus-node-exporter:
      kind: DaemonSet

# Enable additional monitoring components and refer to official docs for valid values.
loki:
  enabled: false
prometheus-blackbox-exporter:
  enabled: false

# Grafana dashboards shipped by this chart as ConfigMaps, picked up by the Grafana
# sidecar (consumers must enable kube-prometheus-stack.grafana.sidecar.dashboards).
# Off by default so existing consumers are unaffected by upgrading this chart.
#
# Most dashboards here are Prometheus-only and render on any cluster. The ones that
# need a log or trace backend are gated by `requires` below, so a cluster without
# Loki or Tempo never gets a dashboard of empty panels:
#
#   baseline-slo          Prometheus   the client-facing baseline; ships everywhere
#   cluster-overview      Prometheus   nodes, workloads, resource usage
#   traefik-overview      Prometheus   ingress RPS / 5xx / 4xx / latency
#   azure-databases       Prometheus   needs azure-metrics-scraper
#   cost-overview         Prometheus   needs azure-cost-exporter and/or opencost
#   traefik-access-logs   Loki         per-request access-log detail
#   cluster-logs          Loki         log volume, error logs, log stream
#   cluster-traces        Tempo        OpenTelemetry span metrics (standalone Tempo)
dashboards:
  enabled: false
  # Dashboard names (filename without .json) to ship. Empty list = all of dashboards/,
  # minus any whose backend requirement below is unmet.
  include: []
  # Which observability backends this cluster has.
  #   logs   - defaults to loki.enabled, since Loki can be a subchart here. Set it
  #            explicitly when Loki is deployed elsewhere (e.g. a central Loki).
  #   traces - no default. Tempo is always deployed as its own release, so this
  #            chart has nothing to infer from; set it to true on clusters running
  #            Tempo with its metrics-generator enabled (span-metrics processor
  #            remote-writing traces_spanmetrics_* into Prometheus).
  #   backends:
  #     logs: true
  #     traces: true
  backends: {}
  # Dashboard name -> the backend it needs. Anything not listed is Prometheus-only and
  # always ships. Extend this if you add a dashboard with its own backend dependency.
  requires:
    traefik-access-logs: logs
    cluster-logs: logs
    cluster-traces: traces
  labels:
    grafana_dashboard: "1"
  # Sets the grafana_folder annotation; requires sidecar folderAnnotation.
  # folder: Cloudkite
